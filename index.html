<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dấu ấn di sản Quảng Trị</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lora:wght@600;700&display=swap">
<style>
/* Layout: dải xanh Trường Sơn mở đầu bằng vĩ tuyến 17; bên dưới là sơ đồ Bắc–Nam cạnh danh sách thẻ; mỗi di tích có trang riêng theo hash. */
:root{
  --font:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif; --serif:"Lora",Georgia,"Times New Roman",serif;
  --gold:#e8b04a; --ridge1:#2a6b4e; --ridge2:#1c4b37; --hero-g1:#0e3125; --hero-g2:#1b5a41; --hero-g3:#6e3a14;
  --bg:#f2f6f1; --surface:#ffffff; --ink:#13241b; --muted:#506157; --line:#d2dcd4;
  --green:#1f5a42; --green-2:#2e7a58; --soft:#e2eee5;
  --laterite:#98481a; --laterite-soft:#f4e5d9;
  --focus:#0b57d0; --btn-bg:#1f5a42; --btn-fg:#ffffff;
  --hero-bg:#143d2d; --hero-ink:#eef6f0; --hero-muted:#b5cfbf; --hero-line:#e0a06a; --hero-stroke:#3f7b60;
  --sea:#e3eee5; --land:#ffffff;
  --bac-a:#1c4b37; --bac-b:#357a5a; --nam-a:#6e3b0c; --nam-b:#a76224;
  --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1712; --surface:#14221a; --ink:#e5eee7; --muted:#a2b3a8; --line:#27382e;
    --green:#86d2a6; --green-2:#62b887; --soft:#1b3024;
    --laterite:#f0a672; --laterite-soft:#33231a;
    --focus:#8ab4ff; --btn-bg:#86d2a6; --btn-fg:#0d1712;
    --hero-bg:#0a1f16; --hero-ink:#e9f3ec; --hero-muted:#9cb8a8; --hero-line:#e9a46e; --hero-stroke:#2f6049;
    --sea:#102219; --land:#16261d; color-scheme:dark;
    --gold:#f0c06a; --ridge1:#173b2b; --ridge2:#0f2a1e; --hero-g1:#08170f; --hero-g2:#0f3324; --hero-g3:#4a2810;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1712; --surface:#14221a; --ink:#e5eee7; --muted:#a2b3a8; --line:#27382e;
  --green:#86d2a6; --green-2:#62b887; --soft:#1b3024;
  --laterite:#f0a672; --laterite-soft:#33231a;
  --focus:#8ab4ff; --btn-bg:#86d2a6; --btn-fg:#0d1712;
  --hero-bg:#0a1f16; --hero-ink:#e9f3ec; --hero-muted:#9cb8a8; --hero-line:#e9a46e; --hero-stroke:#2f6049;
  --sea:#102219; --land:#16261d; color-scheme:dark;
  --gold:#f0c06a; --ridge1:#173b2b; --ridge2:#0f2a1e; --hero-g1:#08170f; --hero-g2:#0f3324; --hero-g3:#4a2810;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{font:400 16px/1.6 var(--font);background:var(--bg);color:var(--ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hero-bg)}
h1,h2,h3{font-family:var(--font);text-wrap:balance;margin:0}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1160px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);color:var(--ink);padding:10px 14px;border-radius:8px;z-index:50}
.skip:focus{left:16px}

/* thanh đầu trang */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero-bg);color:var(--hero-ink);border-bottom:1px solid color-mix(in srgb,var(--hero-ink) 14%,transparent)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;letter-spacing:.01em;min-height:44px;white-space:nowrap}
.brand svg{width:30px;height:30px;flex:none}
.nav{display:flex;gap:4px;overflow-x:auto;order:3;width:100%}
.nav a{padding:10px 10px;text-decoration:none;border-radius:8px;color:var(--hero-muted);font-size:.95rem;white-space:nowrap;min-height:44px;display:inline-flex;align-items:center}
.nav a:hover{color:var(--hero-ink);background:color-mix(in srgb,var(--hero-ink) 10%,transparent)}
.lang{flex:none;display:flex;border:1px solid color-mix(in srgb,var(--hero-ink) 35%,transparent);border-radius:999px;overflow:hidden}
.lang button{white-space:nowrap;border:0;background:transparent;color:var(--hero-ink);padding:8px 14px;font:500 .9rem var(--font);cursor:pointer;min-height:44px}
.lang button[aria-pressed="true"]{background:var(--hero-ink);color:var(--hero-bg)}
@media (min-width:1060px){ .nav{order:0;width:auto;margin-left:auto;min-width:0} .top .wrap{flex-wrap:nowrap} }

/* mở đầu */
.hero{background:linear-gradient(165deg,var(--hero-g1) 0%,var(--hero-g2) 58%,var(--hero-g3) 135%);color:var(--hero-ink);padding-block:56px 110px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 18%,rgba(232,176,74,.22),transparent 38%);pointer-events:none}
.hero .wrap{position:relative}
.ridge{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:96px;display:block}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:32px;align-items:center}
.eyebrow{font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.hero h1{font:700 clamp(2.2rem,5.6vw,3.9rem)/1.08 var(--serif);margin:10px 0 16px;letter-spacing:-.01em}
.lede{font-size:1.1rem;color:var(--hero-muted);max-width:56ch}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:10px;border:1.5px solid var(--btn-bg);background:var(--btn-bg);color:var(--btn-fg);text-decoration:none;font:600 .95rem var(--font);cursor:pointer}
.btn.ghost{background:transparent;color:var(--green);border-color:var(--green)}
.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.hero .btn{background:var(--hero-ink);color:var(--hero-bg);border-color:var(--hero-ink)}
.hero .btn.ghost{background:transparent;color:var(--hero-ink);border-color:color-mix(in srgb,var(--hero-ink) 50%,transparent)}
.hero-note{margin-top:18px;font-size:.88rem;color:var(--hero-muted)}
.hero-art{width:100%;height:auto}
.hero-art text{font-family:var(--font)}
@media (max-width:820px){ .hero .wrap{grid-template-columns:1fr} .hero-art{max-width:420px} }

/* khối chung */
section{scroll-margin-top:120px}
.sec{padding-block:48px}
.sec h2{font:700 clamp(1.5rem,3.4vw,2.1rem)/1.2 var(--serif);color:var(--green)}
.sec .intro{color:var(--muted);margin-top:8px;max-width:62ch}

/* công cụ lọc */
.tools{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;margin:20px 0 8px;align-items:end}
.tools label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px;font-weight:500}
.tools input,.tools select{width:100%;min-height:46px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:400 1rem var(--font)}
.tools .clear{min-height:46px;padding:9px 16px;border:1.5px solid var(--green);color:var(--green);background:transparent;border-radius:10px;font:600 .92rem var(--font);cursor:pointer}
.status{margin:6px 0 14px;color:var(--muted);font-size:.95rem;min-height:1.5em}
.views{display:none;gap:8px;margin-bottom:12px}
.views button{flex:1;min-height:46px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font:500 .95rem var(--font);cursor:pointer}
.views button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.layout{display:grid;grid-template-columns:minmax(280px,390px) minmax(0,1fr);gap:22px;align-items:start}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px)}
.mapbox h3{font-size:1rem;margin:2px 4px 8px;color:var(--green)}
.mapbox svg{width:100%;height:auto;display:block}
.mapnote{font-size:.8rem;color:var(--muted);margin:8px 4px 0}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:8px 4px 0;font-size:.85rem}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.sea{fill:var(--sea)} .land{fill:var(--land);stroke:var(--line);stroke-width:1}
.parallel{stroke:var(--laterite);stroke-width:1.6;stroke-dasharray:6 5}
.axis{fill:var(--muted);font-size:11px;font-family:var(--font)}
.node{cursor:pointer}
.node circle{stroke:var(--surface);stroke-width:2}
.node.bac circle{fill:var(--green-2)} .node.nam circle{fill:var(--laterite)}
.node text{font-size:11.5px;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;font-family:var(--font)}
.node.dim{opacity:.18}
.node.on circle{r:12;stroke:var(--focus);stroke-width:3}
.node:focus-visible circle{stroke:var(--focus);stroke-width:3}

/* thẻ di tích */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card.on{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 28%,transparent)}
.ph{height:112px;display:flex;align-items:flex-end;justify-content:space-between;padding:12px 16px;color:#fff;position:relative;background-image:radial-gradient(circle at 88% 12%,rgba(255,255,255,.2),transparent 42%)}
.pico{position:absolute;top:12px;left:14px;width:38px;height:38px;opacity:.92}
.rd{position:absolute;top:12px;right:12px;background:#fff;color:#1f5a42;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px}
.ph.bac{background:linear-gradient(135deg,var(--bac-a),var(--bac-b))}
.ph.nam{background:linear-gradient(135deg,var(--nam-a),var(--nam-b))}
.ph .num{font-size:2.4rem;font-weight:800;line-height:1;letter-spacing:-.02em;opacity:.95}
.ph .reg{font-size:.78rem;background:rgba(0,0,0,.28);padding:3px 10px;border-radius:999px;font-weight:500}
.cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.cbody h3{font-size:1.1rem;line-height:1.3;font-weight:700}
.cbody .alt{color:var(--muted);font-size:.9rem;font-style:italic}
.cbody .sum{font-size:.92rem;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.75rem;background:var(--soft);color:var(--green);padding:3px 10px;border-radius:999px;font-weight:500}
.vid{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.vid::before{content:"";width:0;height:0;border-left:8px solid var(--laterite);border-top:5px solid transparent;border-bottom:5px solid transparent}
.row{display:flex;gap:8px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.empty{padding:32px;text-align:center;background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;color:var(--muted)}

/* cách dùng */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:24px;padding:0;list-style:none;counter-reset:st}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 20px;counter-increment:st}
.steps li::before{content:counter(st);display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--green);font-weight:700;margin-bottom:10px}
.steps h3{font-size:1.05rem;margin-bottom:6px}
.steps p{color:var(--muted);font-size:.95rem}
.tip{margin-top:16px;color:var(--muted);font-size:.95rem}

/* giới thiệu */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;margin-top:20px}
.about .box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.about h3{font-size:1.05rem;color:var(--green);margin-bottom:8px}
.about .box p{color:var(--muted);font-size:.96rem}
.about .box.warn{background:var(--laterite-soft);border-color:transparent}
.about .box.warn h3{color:var(--laterite)}
@media (max-width:760px){ .about{grid-template-columns:1fr} }

/* trang chi tiết */
.dwrap{padding-block:28px 56px}
.wrap.dwrap{max-width:980px}
.objs,.task,.srcs,.dgrid.one,.story{max-width:none}
.para p{max-width:72ch}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--green);font-weight:600;text-decoration:none}
.dhead{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end}
.dhead .big{font-size:clamp(3rem,9vw,5.5rem);font-weight:800;line-height:.9;letter-spacing:-.03em;color:var(--green-2);opacity:.55}
.dhead h1{font-size:clamp(1.8rem,4.6vw,2.8rem);line-height:1.12;font-weight:800;color:var(--green)}
.dhead .altn{color:var(--muted);font-style:italic;font-size:1.05rem;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.chip{font-size:.8rem;padding:4px 12px;border-radius:999px;font-weight:600;background:var(--soft);color:var(--green)}
.chip.bac{background:var(--soft);color:var(--green)}
.chip.nam{background:var(--laterite-soft);color:var(--laterite)}
.player{margin-top:22px;aspect-ratio:16/9;width:100%;max-width:860px;border-radius:18px;display:grid;place-items:center;text-align:center;padding:20px;color:#fff;position:relative;overflow:hidden}
.player.bac{background:linear-gradient(135deg,var(--bac-a),var(--bac-b))}
.player.nam{background:linear-gradient(135deg,var(--nam-a),var(--nam-b))}
.player.has{padding:0;background:#000}
.vwrap{margin-top:22px;max-width:860px}
.vwrap .player{margin-top:10px}
.player video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.vtabs{display:flex;flex-wrap:wrap;gap:8px}
.vtab{min-height:44px;padding:8px 16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;font:500 .92rem var(--font);cursor:pointer}
.vtab[aria-selected="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.vcap{margin-top:8px;color:var(--muted);font-size:.95rem}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .play{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.7);display:grid;place-items:center;margin:0 auto 12px}
.player .play::after{content:"";margin-left:5px;border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent}
.player strong{display:block;font-size:1.15rem}
.player span{font-size:.92rem;opacity:.92}
.dgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;margin-top:28px;align-items:start}
.dgrid.both{grid-template-columns:minmax(0,1fr)}
.lang2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.dsum h2,.facts h2,.fb h2{font-size:1.05rem;color:var(--green);margin-bottom:8px}
.dsum p{font-size:1.02rem;max-width:68ch}
.dsum .lbl{display:block;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600}
.facts{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.facts dl{margin:0;display:grid;gap:12px}
.facts dt{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.facts dd{margin:2px 0 0;font-size:.95rem}
.verify{display:inline-block;font-size:.72rem;font-weight:700;background:var(--laterite-soft);color:var(--laterite);border-radius:999px;padding:2px 9px;margin-bottom:8px}
.fb{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
.fb p{color:var(--muted);font-size:.95rem;max-width:58ch}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
.pn a{display:block;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;text-decoration:none;min-height:64px}
.pn a small{display:block;color:var(--muted);font-size:.78rem}
.pn a b{color:var(--green)}
.pn a:last-child{text-align:right}
.pn .ghost{visibility:hidden}
@media (max-width:820px){
  .tools{grid-template-columns:1fr 1fr}
  .tools .q,.tools .clear{grid-column:1/-1}
  .views{display:flex}
  .layout{grid-template-columns:1fr}
  .mapbox{position:static}
  .layout[data-view="list"] .mapbox{display:none}
  .layout[data-view="map"] .cardsbox{display:none}
  .dgrid{grid-template-columns:minmax(0,1fr)}
}

/* dòng thời gian */
.timeline{list-style:none;margin:26px 0 0;padding:0 0 0 18px;border-left:3px solid var(--green-2);display:grid;gap:18px}
.timeline li{position:relative;display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 18px;align-items:baseline}
.timeline li::before{content:"";position:absolute;left:-27px;top:9px;width:13px;height:13px;border-radius:50%;background:var(--bg);border:3px solid var(--laterite)}
.timeline .yr{font-weight:800;color:var(--laterite);font-size:1.05rem;font-variant-numeric:tabular-nums}
.timeline .ev p{font-size:1rem}
.timeline .ev a{display:inline-block;margin-top:4px;color:var(--green);font-weight:600;font-size:.92rem;text-decoration:none;min-height:32px}
.timeline .ev a:hover{text-decoration:underline}
@media (max-width:640px){ .timeline li{grid-template-columns:1fr} }
/* câu đố */
.quiz{margin-top:22px;max-width:760px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.qprog{font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.qq{font-size:1.25rem;line-height:1.35;margin:8px 0 16px;color:var(--ink)}
.qopts{display:grid;gap:10px}
.qo{min-height:50px;text-align:left;padding:10px 16px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;font:500 1rem var(--font);cursor:pointer}
.qo:hover:not(:disabled){border-color:var(--green-2)}
.qo:disabled{cursor:default}
.qo.ok{border-color:var(--green-2);background:var(--soft)}
.qo.bad{border-color:var(--laterite);background:var(--laterite-soft)}
.qo b{margin-left:8px;font-size:.85rem}
.qexp{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.qexp p{margin-bottom:12px}
.qdone{text-align:center;padding:12px 0}
.qscore{font-size:3rem;font-weight:800;color:var(--green);line-height:1.1}
.qdone p{margin-bottom:14px}
/* từ khó */
.glossary{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:22px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.gcard h3{font-size:1.05rem;color:var(--green);margin-bottom:6px}
.gcard p{color:var(--muted);font-size:.95rem}
.en2{font-style:italic;margin-top:4px}
/* số liệu nhanh và suy ngẫm */
.qh{font-size:1.05rem;color:var(--green);margin-top:28px}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:10px}
.qf{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:4px;align-content:start}
.qf b{font-size:1.6rem;line-height:1.15;color:var(--laterite);font-weight:800}
.qf span{color:var(--muted);font-size:.9rem}
.qf i{display:block;margin-top:2px}
.think{margin-top:28px;background:var(--soft);border-radius:16px;padding:20px}
.think h2{font-size:1.05rem;color:var(--green)}
.thint{color:var(--muted);font-size:.92rem;margin:4px 0 10px}
.think ol{margin:0;padding-left:22px;display:grid;gap:10px}

.progress{margin:0 0 8px;color:var(--laterite);font-weight:600;font-size:.92rem}

.dbanner.bac{background:linear-gradient(135deg,var(--bac-a),var(--bac-b))}

.objs{margin-top:26px;background:var(--soft);border-radius:18px;padding:20px 22px;max-width:860px}

.pull small{display:block;font:italic 400 1rem var(--font);color:var(--muted);margin-top:4px}

.task{margin-top:16px;max-width:860px;background:var(--surface);border:1.5px dashed var(--laterite);border-radius:16px;padding:18px 22px}

.task p i{display:block;color:var(--muted);margin-top:6px}
.dgrid.one{grid-template-columns:minmax(0,1fr);max-width:860px}
.srcs{margin-top:28px;max-width:860px}

.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.sheet{display:none}
/* mục dành cho giáo viên */
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:22px}
@media (max-width:760px){ .tgrid{grid-template-columns:minmax(0,1fr)} }
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;min-width:0}
.tcard.wide{grid-column:1/-1}
.tcard.soft{background:var(--laterite-soft);border-color:transparent}
.tcard h3{font:700 1.15rem/1.3 var(--serif);color:var(--green);margin-bottom:10px}
.tcard.soft h3{color:var(--laterite)}
.tcard p{color:var(--muted);margin-bottom:8px}
.tcard ul,.tcard ol{margin:0;padding-left:20px;display:grid;gap:8px}
.tl{list-style:none;padding:0!important;gap:10px!important}
.tl li b{display:inline-block;min-width:66px;color:var(--laterite)}
.xgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.xgrid div{background:var(--soft);border-radius:12px;padding:12px 14px;display:grid;gap:4px;align-content:start}
.xgrid b{color:var(--green)}
.xgrid span{font-size:.92rem;color:var(--muted)}
/* phiếu học tập khi in */
@media print{

  .wl{height:22pt;border-bottom:1px solid #666}
  .sline{margin-bottom:6pt}.sfoot{margin-top:16pt;font-size:9pt;color:#444}
}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{transition:none!important;animation:none!important} }

  story: { vi: [

   en: [

   ["Under constant attack", "According to Báo Văn hóa, from 1964 to 1972 US aircraft and gunboats attacked the site in hundreds of raids, with large bombs, cluster bombs and naval mines. That is why it was called a “fire coordinate”: every crossing was a brush with life and death. From the early 1960s the landing was organised into two main crossing points; under attack, crews opened backup landings, dispersed units, crossed flexibly and repaired ferries fast after each raid."],
   ["People and numbers", "Keeping the crossing open took soldiers, youth volunteers, frontline laborers and local residents. Some jumped into the water to save vehicles and comrades. By October 1972 about 1,000 tons of weapons had crossed at the Gianh and Long Đại points, and about 5,000 tons more in November (per the article). The guiding rule was: “The enemy attacks, we keep moving.”"],

   ["Hôm nay", "Năm 1996, tỉnh Quảng Bình cho phá đá và đưa hài cốt các liệt sĩ ra ngoài; theo báo, các anh chị nằm sát bên nhau. Nay trước hang có đền tưởng niệm, nơi con cháu, đồng đội và nhiều người đến thắp hương, nhất là vào ngày 14/11 hằng năm. Lễ tưởng niệm 50 năm ngày hy sinh được tổ chức năm 2022."]],
   en: [
   ["Background", "Tám Cô Cave is a rock cave at about km 16 on Route 20 – Quyết Thắng, in Tân Trạch Commune, Bố Trạch District (pre-merger wording; some papers say Thượng Trạch Commune, to be verified). Route 20 – Quyết Thắng is ranked a national historical site by the Ministry of Culture, Sports and Tourism, while the cave itself was ranked a special national monument by the Prime Minister (per Sài Gòn Giải Phóng; Nhân Dân gives Decision 2383/QĐ-TTg of 9 Dec 2013, to be verified)."],
   ["Afternoon of 14 November 1972", "According to Báo Pháp luật, that afternoon B-52s bombed while a youth volunteer team was repairing the road. Sirens sounded and everyone took shelter in the cave. A boulder weighing thousands of tons fell and sealed the entrance. Tracked vehicles could not move it, and explosives were rejected because the blast could harm those inside. Comrades could only pass water and porridge through a narrow pipe. On the ninth day (23 November) a faint “Mother!” was heard, then silence."],
   ["The people", "Eight youth volunteers of Team 25, Company 217, Construction Board 67, Group 559: four women (Lê Thị Lương, Đỗ Thị Loan, Lê Thị Mai, Trần Thị Tơ) and four men (Hoàng Văn Vụ, Nguyễn Văn Phương, Nguyễn Văn Huệ, Nguyễn Mậu Kỷ). All came from Hoằng Hóa District, Thanh Hóa Province. Nguyễn Mậu Kỷ was 38, the eldest; the others were about 18–20. Five artillerymen also died that afternoon, with their names on the marker at the cave (the article gives no unit or names). In all, 13 people."],

  story: { vi: [
   ["Bối cảnh", "Tên đầy đủ của di tích là Bến phà Long Đại II, thuộc xã Trường Ninh, tỉnh Quảng Trị (theo Báo Văn hóa). Bến nằm trên Đường 15 chiến lược, được ví là “yết hầu”, huyết mạch nối hậu phương miền Bắc với chiến trường miền Nam. Từ năm 1965, khi Mỹ mở rộng chiến tranh phá hoại miền Bắc, nơi đây liên tục bị đánh phá. Đầu năm 1971, bến được tách thành Phà I (gần cầu) và Phà II (cách khoảng 500 m về phía hạ lưu)."],
   ["Đại đội 130", "Đại đội 130 thanh niên xung phong có 150 người, tuổi mười tám, đôi mươi, trực tiếp quản lý Phà II và mở Đường 18. Sau mỗi đợt bom, các bạn cùng công binh và dân công hỏa tuyến san lấp hố bom, khôi phục bến để vũ khí, lương thực và hàng hóa tiếp tục được chuyển vào chiến trường."],
   ["Tháng 9/1972", "Ngày 19/9/1972, máy bay Mỹ ném bom trúng Phà II. Trong khoảng một giờ, 15 thanh niên xung phong (7 nữ, 8 nam) hy sinh: 3 người khi đang chở hàng trên thuyền, 12 người tại bến và trong hầm trú ẩn. Ngày 23/9/1972, một trận bom khác làm chiến sĩ Trần Mạnh Hà hy sinh khi đang làm nhiệm vụ. Tổng cộng 16 người đã ngã xuống tại bến phà trong tháng 9/1972. Bài báo không nêu tuổi cụ thể và quê quán của các anh chị."],
   ["Xếp hạng", "Ngày 9/9/2025, Bộ Văn hóa, Thể thao và Du lịch ra quyết định xếp hạng Bến phà Long Đại II là di tích lịch sử cấp quốc gia (theo Báo Văn hóa; cần đối chiếu số quyết định). Khi học, em cần dùng đúng tên chính thức “Long Đại II”, vì Phà I và Phà II là hai bến khác nhau."]],
   en: [
   ["Background", "The official name of the site is Long Đại II Ferry Landing, in Trường Ninh Commune, Quảng Trị Province (per Báo Văn hóa). It lies on the strategic Route 15, called the “chokepoint”, the lifeline linking the northern rear to the southern battlefield. From 1965, when the US widened its bombing of the North, it was attacked continually. In early 1971 the landing was split into Ferry I (near the bridge) and Ferry II (about 500 m downstream)."],
   ["Company 130", "Youth Volunteer Company 130 had 150 members, aged about eighteen to twenty, and ran Ferry II directly and built Route 18. After every raid they worked with engineers and frontline laborers to fill bomb craters and restore the landing so weapons, food and goods could keep reaching the battlefield."],
   ["September 1972", "On 19 September 1972, US aircraft bombed Ferry II directly. Within about an hour 15 youth volunteers (7 women, 8 men) died: 3 while carrying cargo by boat, 12 at the landing and in the shelter. On 23 September another raid killed soldier Trần Mạnh Hà on duty. In all, 16 people fell at the ferry in September 1972. The article does not give their individual ages or home towns."],
   ["Designation", "On 9 September 2025 the Ministry of Culture, Sports and Tourism ranked Long Đại II Ferry Landing a national historical site (per Báo Văn hóa; decision number to be verified). Use the official name “Long Đại II”, because Ferry I and Ferry II were separate landings."]] },
  pull: null,

 },

 "hang-len-ha": {
  obj: { vi: ["Giải thích vai trò của Trạm thông tin A69 trong trục thông tin quân sự Bắc – Nam.",
              "Kể lại sự kiện chiều 2/7/1972 và việc đường liên lạc được nối lại chỉ sau khoảng một giờ.",
              "Nêu được ý nghĩa của khẩu hiệu “Tim còn đập, mạch máu thông tin còn thông suốt”."],
         en: ["Explain the role of Communications Station A69 on the North–South military signal axis.",
              "Retell the events of the afternoon of 2 July 1972 and how the line was restored in about an hour.",
              "Explain what the slogan “While the heart beats, the lifeblood of communications keeps flowing” means."] },
  story: { vi: [
   ["Bối cảnh", "Hang Lèn Hà nằm ở núi Lèn Hà, bản Hà, xã Thanh Hóa, huyện Tuyên Hóa, tỉnh Quảng Bình (cách ghi trước hợp nhất), cách đường Hồ Chí Minh khoảng 3 km. Trạm thông tin A69 được thành lập ngày 7/1/1967, thuộc Đại đội 9, Trung đoàn 134, nay là Lữ đoàn 134, Binh chủng Thông tin liên lạc. Đường lên khu đặt máy trên hang có 269 bậc thang; báo Thanh Niên ghi rằng con số này được chọn để trùng với tên Trạm A69."],
   ["Trạm trung chuyển", "Trạm A69 là trạm trung gian chuyển tiếp trên trục thông tin quân sự Bắc – Nam. Trạm bảo đảm liên lạc cho nhiều đơn vị, trong đó có Cụm kho Binh trạm 25 (Đoàn 559), Binh trạm 12 ở Cổng Trời, Sư đoàn Phòng không 367, Viện 4 (Quân khu 4), Đồn biên phòng Cha Lo và căn cứ hải quân ở Ba Đồn, chính là địa phương của trường chúng ta. Trạm cũng là kho dự trữ trang bị của Bộ Tư lệnh Thông tin liên lạc, và phục vụ các chiến dịch như Đường 9 – Nam Lào, Cánh đồng Chum 1971 và Quảng Trị 1972."],
   ["Chiều 2/7/1972", "Theo Báo Nhân Dân, một máy bay Mỹ bắn pháo khói vào nhà ăn của trạm để chỉ điểm. Chưa đầy năm phút sau, hai máy bay khác ném ba quả bom vào hai đầu núi và giữa hội trường, rồi ném bom phát quang và bom cháy. Trạm máy trên hang hư hỏng nặng, khoảng 1.500 m đường dây bị đứt. Mười ba cán bộ, chiến sĩ hy sinh, trong đó có 10 nữ và 3 nam. Các chiến sĩ còn sống khôi phục đường dây, nối lại máy, và chỉ sau khoảng một giờ liên lạc Bắc – Nam đã thông suốt. Khẩu hiệu của đơn vị lúc đó: “Tim còn đập, mạch máu thông tin còn thông suốt”."],
   ["Ghi nhớ", "Mười ba liệt sĩ là: Hoàng Thị Liên, Nguyễn Thị Anh, Ngô Thị Luận, Chu Thị Mạnh, Lê Thị Châm, Trần Thị Loan, Nguyễn Thị Thảo, Vũ Thị Lan, Bùi Thị Lung, Cao Thị Xuyến, Đàm Văn Trình (Trạm trưởng), Lương Văn Chấn và Trần Văn Xây (theo Báo Nhân Dân). Trạm được tặng hai Huân chương Chiến công hạng Nhì và danh hiệu Anh hùng lực lượng vũ trang nhân dân (bài báo không nêu năm phong tặng). Ngày 7/5/2009, Bộ Văn hóa, Thể thao và Du lịch xếp hạng hang là di tích lịch sử cấp quốc gia. Lễ tưởng niệm 50 năm ngày hy sinh được tổ chức ngày 2/7/2022 tại khu di tích."]],
   en: [
   ["Background", "Lèn Hà Cave lies on Lèn Hà mountain, Hà hamlet, Thanh Hóa Commune, Tuyên Hóa District, Quảng Bình Province (pre-merger wording), about 3 km from the Hồ Chí Minh road. Communications Station A69 was founded on 7 January 1967 under Company 9, Regiment 134, now Brigade 134 of the Signal Corps. The path up to the equipment room in the cave has 269 steps; Thanh Niên newspaper says the number was chosen to echo the name A69."],
   ["A relay station", "Station A69 was an intermediate relay on the North–South military signal axis. It kept lines open for many units, including Supply Station Cluster 25 (Group 559), Supply Station 12 at Cổng Trời, the 367th Air Defence Division, Hospital 4 (Military Region 4), Cha Lo border post and the naval base at Ba Đồn, our own school’s area. It was also a reserve depot for the Signal Command and served campaigns such as Route 9 – Southern Laos, the 1971 Plain of Jars and Quảng Trị 1972."],
   ["Afternoon of 2 July 1972", "According to Nhân Dân, a US aircraft fired a smoke shell at the station’s mess to mark it. Less than five minutes later two more aircraft dropped three bombs on both mountain ends and the middle of the meeting hall, followed by clearing bombs and incendiaries. The equipment room in the cave was badly damaged and about 1,500 m of line was cut. Thirteen officers and soldiers died: 10 women and 3 men. The survivors repaired the line, reconnected the sets, and in about an hour North–South communication flowed again. The unit’s slogan then: “While the heart beats, the lifeblood of communications keeps flowing.”"],
   ["Remembering", "The thirteen martyrs are: Hoàng Thị Liên, Nguyễn Thị Anh, Ngô Thị Luận, Chu Thị Mạnh, Lê Thị Châm, Trần Thị Loan, Nguyễn Thị Thảo, Vũ Thị Lan, Bùi Thị Lung, Cao Thị Xuyến, Đàm Văn Trình (station chief), Lương Văn Chấn and Trần Văn Xây (per Nhân Dân). The station received two Second-Class Feat Medals and the title Hero of the People’s Armed Forces (year not given in the article). On 7 May 2009 the Ministry of Culture, Sports and Tourism ranked the cave a national historical site. A ceremony for the 50th anniversary was held on 2 July 2022 at the site."]] },
  pull: { vi: "Tim còn đập, mạch máu thông tin còn thông suốt.", en: "While the heart beats, the lifeblood of communications keeps flowing.", who: "Khẩu hiệu của Trạm A69 (theo Báo Nhân Dân)", whoEn: "Slogan of Station A69 (per Nhân Dân)" },
  task: { vi: "Hãy tưởng tượng chiến trường bị mất liên lạc một giờ: điều gì có thể xảy ra với các đơn vị đang chờ lệnh? Từ đó giải thích vì sao các chiến sĩ coi “dây máy là vũ khí”. Em cũng có thể tìm thêm: ở trường ta hôm nay, những phương tiện nào đang giữ vai trò “mạch máu thông tin”?",
          en: "Imagine the battlefield losing contact for an hour: what could happen to units waiting for orders? Use it to explain why the soldiers treated “the line as a weapon”. You can also look into it: at school today, what carries the role of “lifeblood of communication”?" },
  src: [["Báo Nhân Dân: Khúc tráng ca hang Lèn Hà", "https://nhandan.vn/khuc-trang-ca-hang-len-ha-post266378.html"],
        ["Báo Nhân Dân: Tưởng niệm 50 năm ngày hy sinh của 13 cán bộ, chiến sĩ Trạm thông tin A69", "https://nhandan.vn/ocop/tuong-niem-50-nam-ngay-hy-sinh-cua-13-can-bo-chien-si-tram-thong-tin-a69-post703630.html"],
        ["Báo Thanh Niên: Lèn Hà, nơi thông tin như dòng máu đỏ", "https://thanhnien.vn/len-ha-noi-thong-tin-nhu-dong-mau-do-185230802075356736.htm"],
        ["Môi trường và Đô thị: Hang Lèn Hà (Quảng Bình), di tích lịch sử ghi dấu chiến công của người lính thông tin", "https://moitruong.net.vn/hang-len-ha-quang-binh-di-tich-lich-su-ghi-dau-chien-cong-cua-nguoi-linh-thong-tin-63585.html"],
        ["Báo Tuổi Trẻ: Xây dựng di tích hang Lèn Hà thành điểm du lịch", "https://tuoitre.vn/du-lich/xay-dung-di-tich-hang-len-ha-thanh-diem-du-lich-1309839.htm"]]
 },

 "hien-luong-ben-hai": {
  obj: { vi: ["Giải thích vì sao sông Bến Hải ở vĩ tuyến 17 trở thành giới tuyến quân sự tạm thời năm 1954.",
              "Kể được “cuộc chiến cột cờ và loa phóng thanh” ở hai đầu cầu.",
              "Nêu được các mốc: cầu mở năm 1952, bị đánh sập năm 1967, được xây lại sau đó."],
         en: ["Explain why the Bến Hải River at the 17th parallel became the temporary military demarcation line in 1954.",
              "Describe the “contest of flagpoles and loudspeakers” at the two ends of the bridge.",
              "Give the key dates: opened 1952, destroyed 1967, rebuilt afterwards."] },
  story: { vi: [
   ["Bối cảnh", "Sau Hiệp định Genève năm 1954, sông Bến Hải, ở vĩ tuyến 17, trở thành giới tuyến quân sự tạm thời chia hai miền. Cầu Hiền Lương bắc qua sông ở huyện Vĩnh Linh, được đưa vào sử dụng năm 1952, khi đó là cây cầu bê tông và gỗ do người Pháp xây. Từ 1954 đến 1975, cầu bị đường ranh giới chia đôi: một nửa bên Bắc, một nửa bên Nam (theo Wikipedia tiếng Anh; cần đối chiếu)."],
   ["Cuộc đọ sức ở hai đầu cầu", "Hai bên thi nhau dựng cột cờ cao và đặt loa công suất lớn để phát đi tiếng nói của mình càng xa càng tốt. Cột cờ bên Bắc cao 38,6 m, nhiều lần bị máy bay và pháo hạm đánh trong những năm 1965–1968; mỗi lần cờ bị hạ, người ta lại dựng cờ mới. Máy khâu được đưa ra tuyến đầu, thợ may địa phương giúp may cờ; hai nữ thợ may Trần Thị Viễn và Ngô Thị Diễm được phong Anh hùng lực lượng vũ trang nhân dân."],
   ["Cầu bị phá và được dựng lại", "Năm 1967, bom Mỹ phá hủy hoàn toàn cả cầu lẫn cột cờ. Trước tiên người ta dùng cầu phao tạm. Năm 1974, một cây cầu mới được xây cạnh cầu cũ để phục vụ hậu cần cho cuộc tiến công mùa Xuân 1975. Cầu được xây lại theo tiêu chuẩn hiện đại năm 1996; năm 2003 vị trí cầu cũ được phục dựng thành cầu đi bộ theo mẫu cầu năm 1952; năm 2005 một cột cờ lớn được dựng ở bờ Bắc; năm 2014 nửa cầu phía Bắc sơn xanh, nửa phía Nam sơn vàng để gợi lại cảnh cầu bị chia đôi (theo Wikipedia tiếng Anh; cần đối chiếu)."],
   ["Hôm nay", "Khu di tích Đôi bờ Hiền Lương – Bến Hải gồm cầu, kỳ đài, nhà liên hợp và nhà đón tiếp. Đây là nơi học sinh có thể hiểu vì sao một dòng sông nhỏ lại từng là biểu tượng của nỗi đau chia cắt và khát vọng thống nhất. Năm xếp hạng di tích quốc gia đặc biệt còn cần đối chiếu."]],
   en: [
   ["Background", "After the 1954 Geneva Accords the Bến Hải River, at the 17th parallel, became the temporary military demarcation line dividing the two zones. The Hiền Lương Bridge crosses it in Vĩnh Linh District; it opened in 1952 as a concrete-and-wood bridge built by the French. From 1954 to 1975 the border line cut the bridge in two: a northern half and a southern half (per English Wikipedia; to be verified)."],
   ["A contest at both ends", "Both sides vied to raise taller flagpoles and set up high-powered loudspeakers to carry their messages as far as possible. The northern flagpole reached 38.6 m and was repeatedly hit by aircraft and naval guns in 1965–1968; each time the flag came down, a new one went up. Sewing machines were sent to the front and local tailors helped; two women tailors, Trần Thị Viễn and Ngô Thị Diễm, were named Heroes of the People’s Armed Forces."],
   ["Destroyed and rebuilt", "In 1967 US bombs destroyed both the bridge and the flagpole. Temporary pontoon bridges came first. In 1974 a new bridge was built beside the old one to support logistics for the 1975 spring offensive. The bridge was rebuilt to modern standards in 1996; in 2003 the original site was rebuilt as a pedestrian bridge modelled on the 1952 one; in 2005 a monumental flagpole was raised on the north bank; in 2014 the northern half was painted blue and the southern half yellow to recall the divided bridge (per English Wikipedia; to be verified)."],
   ["Today", "The Hiền Lương – Bến Hải memorial site includes the bridge, a flag tower, a joint house and a reception house. It lets students see why a small river became a symbol of the pain of division and the wish for reunification. The year of its special national monument ranking still needs checking."]] },
  pull: null,
  task: { vi: "Vì sao hai bên thi nhau dựng cột cờ cao và đặt loa lớn? Viết ba câu trả lời của em, rồi trao đổi với bạn bên cạnh xem hai bạn có cùng ý không. Gợi ý thêm: tìm vĩ tuyến 17 trên quả địa cầu hoặc bản đồ và nêu vĩ tuyến này đi qua những tỉnh nào của Việt Nam.",
          en: "Why did both sides compete to raise tall flagpoles and big loudspeakers? Write three sentences of your own, then compare with a classmate. Extra: find the 17th parallel on a globe or map and name the provinces of Vietnam it crosses." },
  src: [["Wikipedia: Hiền Lương Bridge (tiếng Anh)", "https://en.wikipedia.org/wiki/Hi%E1%BB%81n_L%C6%B0%C6%A1ng_Bridge"]]
 },

 "dia-dao-vinh-moc": {
  obj: { vi: ["Mô tả được cấu trúc ba tầng của địa đạo Vịnh Mốc và các công trình bên trong.",
              "Giải thích vì sao người dân Vĩnh Linh phải đào địa đạo để sống và chiến đấu.",
              "Nêu được vai trò của các cửa hầm hướng ra biển đối với đảo Cồn Cỏ."],
         en: ["Describe the three-level structure of the Vịnh Mốc tunnels and the rooms inside.",
              "Explain why the people of Vĩnh Linh had to dig tunnels to live and fight.",
              "State the role of the sea-facing entrances for Cồn Cỏ Island."] },
  story: { vi: [
   ["Bối cảnh", "Địa đạo Vịnh Mốc là một làng hầm dưới lòng đất ở vùng Vĩnh Linh, sát giới tuyến quân sự tạm thời. Người dân bắt đầu đào từ năm 1965, khi chiến tranh phá hoại của Mỹ diễn ra ác liệt, để có nơi trú ẩn và sinh sống giữa bom đạn. Theo Vietnam+, công việc kéo dài gần 20 tháng, hơn 18.000 ngày công, đào và chuyển hơn 6.000 m³ đất đá bằng cuốc và xẻng."],
   ["Một làng dưới đất", "Địa đạo có ba tầng; tầng sâu nhất cách mặt đất 21–23 m, lòng hầm cao khoảng 1,7–1,8 m. Có 13 cửa, trong đó 6 cửa thông lên đồi và 7 cửa hướng ra biển. Mỗi phòng nhỏ dành cho 2–4 người. Bên trong có hội trường chứa 50–60 người, giếng nước, nhà hộ sinh, trạm phẫu thuật, trạm xá và bếp Hoàng Cầm (bếp nấu ít khói)."],
   ["Sống và tiếp tế", "Các nguồn ghi chiều dài khác nhau: Vietnam+ ghi hơn 1.000 m chưa kể các ngách; nhiều tài liệu khác ghi tổng chiều dài khoảng 2.000 m. Số người sống trong hầm cũng được ghi khác nhau, từ “hàng trăm người” đến khoảng 60 gia đình; điều chắc chắn là có 17 em bé chào đời ngay trong địa đạo. Các cửa hầm hướng ra biển còn là nơi xuất phát của những chuyến vận chuyển, tiếp tế cho đảo Cồn Cỏ."],
   ["Xếp hạng", "Địa đạo Vịnh Mốc được Thủ tướng Chính phủ xếp hạng di tích quốc gia đặc biệt theo Quyết định số 2408/QĐ-TTg ngày 31/12/2014 (theo Vietnam+). Em hãy lưu ý rằng khi các nguồn ghi khác nhau về một con số, ta nên nêu cả hai và ghi rõ nguồn, đó cũng là cách làm việc của người nghiên cứu lịch sử."]],
   en: [
   ["Background", "The Vịnh Mốc tunnels are an underground village in Vĩnh Linh, right beside the temporary military demarcation line. People began digging in 1965, when the US bombing of the North was fierce, to have shelter and a place to live amid the bombs. According to Vietnam+, the work took nearly 20 months and over 18,000 work-days, digging and hauling more than 6,000 m³ of earth and rock with picks and shovels."],
   ["A village underground", "The tunnels have three levels; the deepest lies 21–23 m below ground, and the passages are about 1.7–1.8 m high. There are 13 entrances: 6 lead up to the hill and 7 face the sea. Each small room held 2–4 people. Inside were a hall for 50–60 people, a well, a maternity room, a surgery station, a clinic and a Hoàng Cầm stove (a low-smoke kitchen)."],
   ["Living and supplying", "Sources give different lengths: Vietnam+ says over 1,000 m not counting side branches; many other references give a total of about 2,000 m. The number of residents is also reported differently, from “hundreds of people” to about 60 families; what is certain is that 17 babies were born inside. The sea-facing entrances were also the starting points for supply runs to Cồn Cỏ Island."],
   ["Designation", "The Prime Minister ranked the Vịnh Mốc tunnels a special national monument under Decision 2408/QĐ-TTg of 31 December 2014 (per Vietnam+). Note that when sources disagree on a number, we state both and name each source; this is also how historians work."]] },
  pull: null,
  task: { vi: "Vẽ mặt cắt ba tầng của địa đạo, ghi độ sâu và đặt tên các phòng. Em sẽ đặt giếng nước, hội trường và nhà hộ sinh ở tầng nào, vì sao? Cuối cùng, ghi lại hai con số về chiều dài địa đạo từ hai nguồn khác nhau và nêu cách em sẽ kiểm tra.",
          en: "Draw a cross-section of the three levels with depths and room names. Which level would you put the well, the hall and the maternity room on, and why? Finally, note the two length figures from different sources and say how you would check them." },
  src: [["Vietnam+: Địa đạo Vịnh Mốc, lưu giữ ký ức chiến tranh, trao truyền khát vọng hòa bình", "https://www.vietnamplus.vn/dia-dao-vinh-moc-luu-giu-ky-uc-chien-tranh-trao-truyen-khat-vong-hoa-binh-post1133040.amp"]]
 },

 "thanh-co-quang-tri": {
  obj: { vi: ["Nêu thời gian và quy mô của trận chiến 81 ngày đêm năm 1972.",
              "Giải thích vai trò của sông Thạch Hãn trong việc tiếp viện cho Thành cổ.",
              "Trình bày được ý nghĩa của trận chiến đối với đàm phán và Hiệp định Paris."],
         en: ["State the dates and scale of the 81-day-and-night battle of 1972.",
              "Explain the role of the Thạch Hãn River in reinforcing the Citadel.",
              "Describe the battle’s significance for the negotiations and the Paris Agreement."] },
  story: { vi: [
   ["Bối cảnh", "Từ ngày 28/6 đến ngày 16/9/1972, trong 81 ngày đêm, quân giải phóng chiến đấu giành lại thị xã Quảng Trị và Thành cổ. Theo Báo Văn hóa, khu vực Thành cổ phải hứng chịu khoảng 328.000 tấn bom đạn; trung bình mỗi chiến sĩ chịu khoảng 100 quả bom và 200 quả đạn pháo."],
   ["Bên dòng Thạch Hãn", "Mỗi ngày có một đại đội vượt sông Thạch Hãn để tiếp viện cho Thành cổ. Có đơn vị vừa vào trận đêm trước, sáng hôm sau chỉ còn vài người sống sót. Cách đánh vượt khỏi quy ước thông thường: không chỉ bộ binh và công binh, mà cả lực lượng thông tin, quân y cũng cầm súng chiến đấu."],
   ["Ý nghĩa", "Theo bài báo, trận đánh góp phần làm thay đổi cục diện chiến tranh cùng với chiến thắng “Điện Biên Phủ trên không”, buộc Mỹ phải nối lại đàm phán, đi đến Hiệp định Paris, đồng thời tạo tiền đề cho Đại thắng mùa Xuân 1975. Bài báo không nêu số liệt sĩ hay quân số hai bên, nên em đừng tự điền con số khi chưa có nguồn."],
   ["Hôm nay", "Dấu tích trận đánh nay không còn nhiều, nhưng Thành cổ vẫn là biểu tượng của chủ nghĩa anh hùng cách mạng đối với người dân Quảng Trị. Nơi đây có đài tưởng niệm và bến thả hoa bên sông Thạch Hãn. Từ năm 2022, Thành cổ và bến thả hoa mở cửa đón khách vào buổi tối. Quyết định xếp hạng di tích quốc gia đặc biệt cần được đối chiếu thêm."]],
   en: [
   ["Background", "From 28 June to 16 September 1972, for 81 days and nights, Liberation forces fought to retake Quảng Trị town and the Citadel. According to Báo Văn hóa, the Citadel area took about 328,000 tons of bombs and shells; on average each soldier faced about 100 bombs and 200 artillery shells."],
   ["By the Thạch Hãn", "Every day one company crossed the Thạch Hãn River to reinforce the Citadel. Some units entered the fight one night and by the next morning only a few survived. The fighting broke the usual rules: not only infantry and engineers but also signal and medical units took up arms."],
   ["Meaning", "According to the article, the battle helped change the course of the war together with the “Dien Bien Phu in the air” victory, forcing the US back to negotiations and the Paris Agreement, and setting the stage for the Spring 1975 victory. The article gives no figure for martyrs or troop strength, so do not fill in numbers without a source."],
   ["Today", "Few traces of the battle remain, but the Citadel is still a symbol of revolutionary heroism for the people of Quảng Trị. There is a memorial and a flower-offering wharf on the Thạch Hãn River. Since 2022 the Citadel and the wharf have opened to visitors in the evening. The decision ranking it a special national monument needs further checking."]] },
  pull: null,
  task: { vi: "Toán: 328.000 tấn bom đạn. Nếu mỗi xe tải chở 10 tấn thì cần bao nhiêu xe? (Đáp án: 32.800 xe.) Nếu các xe xếp hàng, mỗi xe dài 8 m, hàng xe dài khoảng bao nhiêu ki-lô-mét? (Khoảng 262 km.) Em có suy nghĩ gì về con số này?",
          en: "Maths: 328,000 tons of bombs and shells. If each truck carries 10 tons, how many trucks is that? (Answer: 32,800.) If the trucks lined up, each 8 m long, how many kilometres would the line stretch? (About 262 km.) What do you think about this number?" },
  src: [["Báo Văn hóa: Cuộc chiến đấu 81 ngày đêm bảo vệ Thành cổ Quảng Trị như một huyền thoại", "https://baovanhoa.vn/doi-song-van-hoa/cuoc-chien-dau-81-ngay-dem-bao-ve-thanh-co-quang-tri-nhu-mot-huyen-thoai-71538.html"]]

   ["Mốc 9/7/1968", "Sau bốn đợt tiến công giải phóng Khe Sanh, quân giải phóng làm chủ cứ điểm sân bay Tà Cơn ngày 9/7/1968, kết thúc Chiến dịch Đường 9 – Khe Sanh (theo Báo Nhân Dân). Diễn biến Khe Sanh được các nguồn Việt Nam và nước ngoài mô tả không hoàn toàn giống nhau; khi học, em nên đọc nhiều nguồn và ghi rõ mỗi ý lấy từ đâu."],

const $ = id => document.getElementById(id);
let lang = "vi";
try { const s = localStorage.getItem("dadsqt-lang"); if (s === "vi" || s === "en" || s === "both") lang = s; } catch (e) {}
let selected = null;
const ui = () => T[lang === "en" ? "en" : "vi"];      // chữ giao diện
const pl = () => lang === "en" ? "en" : "vi";          // ngôn ngữ nội dung chính
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
SITES.forEach(s => { s.key = norm(s.vi.name + " " + s.en.name + " " + s.themes.map(t => THEMES[t].vi + " " + THEMES[t].en).join(" ") + " " + REG[s.region].vi); });
const gmaps = s => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(s.vi.name + " Quảng Trị");
const hashOf = s => "#di-tich-" + s.slug;

function buildSelects() {
  const t = ui(), L = pl();
  const keep = { fr: $("fr").value, ft: $("ft").value, fv: $("fv").value };
  const opt = (k, v) => '<option value="' + k + '">' + v + '</option>';
  $("fr").innerHTML = opt("", t.all) + Object.keys(REG).map(k => opt(k, REG[k][L])).join("");
  $("ft").innerHTML = opt("", t.all) + Object.keys(THEMES).map(k => opt(k, THEMES[k][L])).join("");
  $("fv").innerHTML = opt("", t.all) + Object.keys(VID).map(k => opt(k, VID[k][L])).join("");
  $("fr").value = keep.fr || ""; $("ft").value = keep.ft || ""; $("fv").value = keep.fv || "";
}

function applyText() {
  const t = ui(), L = pl();
  document.documentElement.lang = L;
  $("brand").textContent = t.brand; $("eyebrow").textContent = t.eyebrow; $("h1").textContent = t.h1; $("lede").textContent = t.lede;
  $("cta1").textContent = t.cta1; $("cta2").textContent = t.cta2; $("heronote").textContent = t.heronote;
  $("artN").textContent = t.artN; $("artS").textContent = t.artS; $("artR").textContent = t.artR;
  $("nav").innerHTML = ["kham-pha", "moc-thoi-gian", "cau-do", "tu-kho", "giao-vien", "huong-dan", "gioi-thieu"].map((id, i) => '<a href="#' + id + '">' + t.nav[i] + '</a>').join("");
  $("h-explore").textContent = t.hExplore; $("i-explore").textContent = t.iExplore;
  $("lq").textContent = t.search; $("q").placeholder = t.ph; $("lfr").textContent = t.region; $("lft").textContent = t.theme; $("lfv").textContent = t.video;
  $("clear").textContent = t.clear; $("maptitle").textContent = t.maptitle; $("mapnote").textContent = t.mapnote;
  $("lgbac").textContent = REG.bac[L]; $("lgnam").textContent = REG.nam[L]; $("vmap").textContent = t.vmap; $("vlist").textContent = t.vlist;
  $("h-guide").textContent = t.hGuide;
  $("steps").innerHTML = t.steps.map(s => '<li><h3>' + s[0] + '</h3><p>' + s[1] + '</p></li>').join("");
  $("tip").textContent = t.tip; $("h-about").textContent = t.hAbout;
  $("about").innerHTML = t.about.map(b => '<div class="box"><h3>' + b[0] + '</h3><p>' + b[1] + '</p></div>').join("") +
    '<div class="box warn" style="grid-column:1/-1"><h3>' + t.warnH + '</h3><p>' + t.foot + '</p></div>';
  $("fname").textContent = t.school; $("foot").textContent = t.brand + " · " + t.eyebrow; $("skip").textContent = lang === "en" ? "Skip to content" : "Đi tới nội dung";
  ["vi", "en", "both"].forEach(k => $(k === "vi" ? "bvi" : k === "en" ? "ben" : "bboth").setAttribute("aria-pressed", String(lang === k)));
  $("stats").innerHTML = t.stats.map(x => '<div><b>' + x[0] + '</b><span>' + x[1] + '</span></div>').join("");
  buildSelects(); renderExtras();
}

function filtered() {
  const q = norm($("q").value), fr = $("fr").value, ft = $("ft").value, fv = $("fv").value;
  return SITES.filter(s => (!q || q.split(" ").every(w => s.key.includes(w))) && (!fr || s.region === fr) && (!ft || s.themes.includes(ft)) && (!fv || s.status === fv));
}

function renderHome() {
  const t = ui(), L = pl(), list = filtered(), ids = new Set(list.map(s => s.id));
  if (selected && !ids.has(selected)) selected = null;
  $("status").textContent = t.count(list.length); $("progress").textContent = t.prog(SITES.filter(x => readSet.has(x.slug)).length);
  const box = $("cards");
  if (!list.length) box.innerHTML = '<div class="empty">' + t.none + '</div>';
  else box.innerHTML = list.map(s => {
    const X = s[L], other = lang === "both" ? s.en.name : (L === "vi" ? s.en.name : s.vi.name);
    return '<article class="card' + (selected === s.id ? ' on' : '') + '" id="c' + s.id + '" data-id="' + s.id + '">' +
      '<div class="ph ' + s.region + '">' + iconSvg(s.themes[0], "pico") + '<span class="num">' + String(s.id).padStart(2, "0") + '</span><span class="reg">' + REG[s.region][L] + '</span>' + (readSet.has(s.slug) ? '<span class="rd">✓ ' + t.badge + '</span>' : '') + '</div>' +
      '<div class="cbody"><h3>' + X.name + '</h3><p class="alt">' + other + '</p><p class="sum">' + X.sum + '</p>' +
      '<div class="tags">' + s.themes.map(k => '<span class="tag">' + THEMES[k][L] + '</span>').join("") + '</div>' +
      '<div class="vid">' + VID[s.status][L] + '</div>' +
      '<div class="row"><a class="btn" href="' + hashOf(s) + '">' + t.detail + '</a>' +
      '<a class="btn ghost" href="' + gmaps(s) + '" target="_blank" rel="noopener">' + t.maps + '</a></div></div></article>';
  }).join("");
  box.querySelectorAll(".card").forEach(c => c.addEventListener("click", e => { if (e.target.closest("a")) return; select(+c.dataset.id, false); }));
  drawMap(ids);
}

function select(id, scroll) {
  selected = (selected === id) ? null : id; renderHome();
  if (selected && scroll) {
    const c = $("c" + selected);
    if (c) {
      if ($("layout").dataset.view === "map" && innerWidth <= 820) setView("list");
      setTimeout(() => {
        c.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
        const h = c.querySelector("h3"); h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true });
      }, 30);
    }
  }
}

function drawMap(ids) {
  const t = ui(), L = pl(), W = 360, H = 560;
  const par = { vi: "Vĩ tuyến 17 (sông Bến Hải)", en: "17th parallel (Bến Hải River)" }[L];
  let g = '<rect class="sea" x="0" y="0" width="' + W + '" height="' + H + '" rx="10"/>';
  g += '<path class="land" d="M0 0 H262 C246 40 270 90 250 150 C236 200 262 250 276 300 C288 345 252 390 228 430 C204 470 170 500 118 560 H0 Z"/>';
  const s5 = SITES.find(s => s.id === 5);
  g += '<line class="parallel" x1="0" x2="' + W + '" y1="' + s5.y + '" y2="' + s5.y + '"/><text class="axis" x="8" y="' + (s5.y + 18) + '">' + par + '</text>';
  g += '<text class="axis" x="8" y="22">' + (L === "vi" ? "Trường Sơn" : "Trường Sơn") + '</text><text class="axis" text-anchor="end" x="' + (W - 8) + '" y="22">' + (L === "vi" ? "Biển Đông" : "East Sea") + '</text>';
  g += '<text class="axis" text-anchor="middle" x="' + (W / 2) + '" y="14">▲ ' + (L === "vi" ? "Bắc" : "N") + '</text><text class="axis" text-anchor="middle" x="' + (W / 2) + '" y="' + (H - 8) + '">▼ ' + (L === "vi" ? "Nam" : "S") + '</text>';
  SITES.forEach(s => {
    const on = selected === s.id, dim = !ids.has(s.id), lab = s[L].name, left = s.x > 200;
    g += '<g class="node ' + s.region + (on ? ' on' : '') + (dim ? ' dim' : '') + '" tabindex="' + (dim ? -1 : 0) + '" role="button" aria-label="' + lab + '" aria-pressed="' + on + '" data-id="' + s.id + '">' +
      '<circle cx="' + s.x + '" cy="' + s.y + '" r="9"/><text x="' + (left ? s.x - 14 : s.x + 14) + '" y="' + (s.y + (s.id === 5 ? -10 : 4)) + '" text-anchor="' + (left ? 'end' : 'start') + '">' + s.id + '. ' + lab + '</text></g>';
  });
  $("svg").innerHTML = g;
  $("svg").querySelectorAll(".node").forEach(n => {
    const id = +n.dataset.id;
    n.addEventListener("click", () => { if (!n.classList.contains("dim")) select(id, true); });
    n.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && !n.classList.contains("dim")) { e.preventDefault(); select(id, true); } });
  });
}

function mediaHtml(s, v) {
  const L = pl(), t = (v.title && (v.title[L] || v.title.vi || v.title.en)) || s[L].name;
  if (v.kind === "youtube") {
    const src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(v.id) + "?cc_load_policy=1&hl=" + (L === "vi" ? "vi" : "en");
    return '<iframe src="' + src + '" title="' + esc(t) + '" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>';
  }
  if (v.kind === "drive") return '<iframe src="https://drive.google.com/file/d/' + encodeURIComponent(v.id) + '/preview" title="' + esc(t) + '" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe>';
  const src = safeSrc(v.src), poster = safeSrc(v.poster), subs = v.subs || {};
  const type = /\.webm$/i.test(src) ? "video/webm" : "video/mp4";
  const tr = ["vi", "en"].filter(k => safeSrc(subs[k])).map(k => '<track kind="subtitles" srclang="' + k + '" label="' + (k === "vi" ? "Tiếng Việt" : "English") + '" src="' + esc(safeSrc(subs[k])) + '"' + (k === L ? ' default' : '') + '>').join("");
  return '<video controls preload="metadata" playsinline' + (poster ? ' poster="' + esc(poster) + '"' : '') + ' aria-label="' + esc(t) + '"><source src="' + esc(src) + '" type="' + type + '">' + tr + '</video>';
}
function playerHtml(s) {
  const t = ui(), L = pl(), list = vlist(s);
  if (!list.length) return '<div class="player ' + s.region + '" role="img" aria-label="' + VID[s.status][L] + '"><div><div class="play"></div><strong>' + VID[s.status][L] + '</strong><span>' + t.playerSub + '</span></div></div>';
  const i = Math.min(vsel[s.slug] || 0, list.length - 1), v = list[i];
  const title = (v.title && (v.title[L] || v.title.vi || v.title.en)) || "";
  const tabs = list.length > 1 ? '<div class="vtabs" role="tablist" aria-label="' + t.pickv + '">' + list.map((x, j) => {
    const tt = (x.title && (x.title[L] || x.title.vi || x.title.en)) || (t.vpart + " " + (j + 1));
    return '<button type="button" role="tab" class="vtab" aria-selected="' + (j === i) + '" data-i="' + j + '">' + esc(tt) + '</button>';
  }).join("") + '</div>' : '';
  return '<div class="vwrap">' + tabs + '<div class="player has">' + mediaHtml(s, v) + '</div>' + (title ? '<p class="vcap">' + esc(title) + '</p>' : '') + '</div>';
}

function route() {
  let h = ""; try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  const s = h.indexOf("di-tich-") === 0 ? SITES.find(x => "di-tich-" + x.slug === h) : null;
  if (s) {
    const changed = current !== s;
    current = s; renderDetail(s);
    $("home").hidden = true; $("detail").hidden = false;
    if (changed) { window.scrollTo(0, 0); const d = $("dh1"); if (d) d.focus({ preventScroll: true }); }
  } else {
    current = null; $("detail").hidden = true; $("home").hidden = false;

  }
  updateBar();
}

 [["Địa đạo","Tunnel network"],["Hệ thống đường hầm đào dưới lòng đất để ở, cất giấu và đi lại an toàn.","A system of tunnels dug underground for living, hiding and moving safely."]],
 [["Yết hầu","Chokepoint"],["Nghĩa gốc là cổ họng; nghĩa bóng là chỗ hiểm yếu nhất của một tuyến đường, nếu bị chặn thì cả tuyến bị tắc.","Literally the throat; figuratively the most vital point of a route, which if blocked chokes the whole route."]],
 [["Tọa độ lửa","Fire coordinate"],["Cách gọi nơi bị đánh phá liên tục và ác liệt trong chiến tranh.","A name for a place attacked continually and fiercely in wartime."]],
 [["Trạm thông tin","Signal station"],["Nơi đặt máy và đường dây để truyền tin giữa các đơn vị.","A place with equipment and lines for passing messages between units."]],
 [["Liệt sĩ","Martyr (fallen soldier)"],["Người hy sinh vì Tổ quốc, được Nhà nước và nhân dân ghi nhận công lao.","A person who died for the country, honoured by the State and the people."]],
 [["Hiệp định Paris","Paris Agreement"],["Hiệp định ký năm 1973 về chấm dứt chiến tranh, lập lại hòa bình ở Việt Nam.","The 1973 agreement on ending the war and restoring peace in Vietnam."]],
 [["Di tích quốc gia đặc biệt","Special national monument"],["Hạng cao nhất trong các hạng di tích ở Việt Nam, cao hơn di tích quốc gia.","The highest rank of historic sites in Vietnam, above national monuments."]],
 [["Thanh niên xung phong","Youth volunteers"],["Lực lượng thanh niên tình nguyện làm những việc như mở đường, giữ đường thông suốt và vận chuyển.","Young volunteers who did work such as building roads, keeping them open and moving supplies."]]
];

let qi = 0, qscore = 0, qpicked = null;
function renderTimeline() {
  const t = ui(), L = pl(), i = L === "vi" ? 3 : 4;
  $("timeline").innerHTML = TIMELINE.map(e => {
    const s = SITES.find(x => x.slug === e[2]);
    return '<li><span class="yr">' + e[1] + '</span><div class="ev"><p>' + e[i] + '</p><a href="#di-tich-' + e[2] + '">' + s[L].name + ' →</a></div></li>';
  }).join("");
}
function renderGloss() {
  const L = pl(), k = L === "vi" ? 0 : 1;
  $("gloss").innerHTML = GLOSS.map(g => '<div class="gcard"><h3>' + g[0][k] + '</h3>' + (lang === "both" ? '<p class="en2">' + g[0][1] + '</p>' : '') + '<p>' + g[1][k] + '</p>' + (lang === "both" ? '<p class="en2">' + g[1][1] + '</p>' : '') + '</div>').join("");
}
function renderQuiz() {
  const t = ui(), L = pl(), k = L === "vi" ? 0 : 1, box = $("quiz");
  if (qi >= QUIZ.length) {
    const msg = qscore === QUIZ.length ? t.qAll : qscore >= Math.ceil(QUIZ.length * 0.6) ? t.qGood : t.qTry;
    box.innerHTML = '<div class="qdone"><p class="qscore">' + qscore + ' / ' + QUIZ.length + '</p><p>' + msg + '</p><button type="button" class="btn" id="qagain">' + t.qAgain + '</button></div>';
    $("qagain").onclick = () => { qi = 0; qscore = 0; qpicked = null; renderQuiz(); };
    return;
  }
  const Q = QUIZ[qi], done = qpicked !== null;
  box.innerHTML = '<p class="qprog">' + t.qProg(qi + 1, QUIZ.length) + '</p><h3 class="qq" id="qq">' + Q.q[k] + '</h3>' +
    '<div class="qopts" role="group" aria-labelledby="qq">' + Q.o.map((o, j) => {
      let c = "qo"; if (done) { if (j === Q.a) c += " ok"; else if (j === qpicked) c += " bad"; }
      return '<button type="button" class="' + c + '" data-j="' + j + '"' + (done ? ' disabled' : '') + '>' + o[k] + (done && j === Q.a ? ' <b>✓ ' + t.qRight + '</b>' : '') + (done && j === qpicked && j !== Q.a ? ' <b>✗ ' + t.qWrong + '</b>' : '') + '</button>';
    }).join("") + '</div>' +
    (done ? '<div class="qexp" role="status"><p>' + Q.e[k] + '</p><div class="row"><a class="btn ghost" href="#di-tich-' + Q.s + '">' + t.qSee + '</a><button type="button" class="btn" id="qnext">' + (qi + 1 < QUIZ.length ? t.qNext : t.qFinish) + '</button></div></div>' : '');
  box.querySelectorAll(".qo").forEach(b => b.onclick = () => { qpicked = +b.dataset.j; if (qpicked === Q.a) qscore++; renderQuiz(); const n = $("qnext"); if (n) n.focus({ preventScroll: true }); });
  const n = $("qnext"); if (n) n.onclick = () => { qi++; qpicked = null; renderQuiz(); };
}
function renderExtras() {
  const t = ui();
  $("h-time").textContent = t.hTime; $("i-time").textContent = t.iTime; $("timenote").textContent = t.timeNote;
  $("h-quiz").textContent = t.hQuiz; $("i-quiz").textContent = t.iQuiz;
  $("h-gloss").textContent = t.hGloss; $("i-gloss").textContent = t.iGloss;
  renderTimeline(); renderGloss(); renderQuiz(); renderTeacher();
}

function setLang(l) {
  lang = l; try { localStorage.setItem("dadsqt-lang", l); } catch (e) {}
  applyText(); renderHome(); if (current) renderDetail(current);
}
$("bvi").onclick = () => setLang("vi");
$("ben").onclick = () => setLang("en");
$("bboth").onclick = () => setLang("both");
["q", "fr", "ft", "fv"].forEach(id => $(id).addEventListener(id === "q" ? "input" : "change", renderHome));
$("clear").onclick = () => { $("q").value = ""; $("fr").value = ""; $("ft").value = ""; $("fv").value = ""; selected = null; renderHome(); };
$("vmap").onclick = () => setView("map"); $("vlist").onclick = () => setView("list");
window.addEventListener("hashchange", route);
applyText(); renderHome(); route();
</script>
